config setup
    charondebug="ike 1, knl 1, cfg 1"
    uniqueids=yes

conn %default
    keyexchange=ikev1
    fragmentation=yes
    forceencaps=yes
    dpdaction=clear
    dpddelay=300s
    rekey=no
    ikelifetime=8h
    lifetime=1h

conn cisco-vpnc
    aggressive=yes
    authby=xauthpsk
    xauth=server
    left=%any
    leftsubnet=0.0.0.0/0
    right=%any
    rightsubnet=0.0.0.0/0
    rightsourceip=192.168.47.10-192.168.47.250
    rightdns=8.8.8.8,8.8.4.4
    ike=aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024,aes128-md5-modp1024,3des-md5-modp1024
    esp=aes256-sha1,aes128-sha1,3des-sha1,aes128-md5,3des-md5
    auto=add
